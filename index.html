<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>أنا أبدع في مدرستي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #7B4BFF 0%, #2DD4BF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash {
            text-align: center;
            color: white;
            padding: 20px;
        }
        .loader {
            width: 60px;
            height: 60px;
            margin: 20px auto;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .message {
            font-size: 18px;
            margin-top: 20px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo">📚 أنا أبدع في مدرستي 🎨</div>
        <div class="loader"></div>
        <div class="message">جاري تحضير التجربة التفاعلية...</div>
    </div>

    <script>
        // Redirection immédiate vers la vidéo (aucune condition)
        window.location.href = 'intro-video.html';
    </script>
</body>
</html>
